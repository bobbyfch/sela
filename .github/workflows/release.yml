# Reader web app and Viewer share an immutable release with current discovery metadata.
name: Publish Reader and Viewer release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml', 'package.json', 'scripts/build.ts']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sela-release
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- dist index.html mobile/index.html library/version.js sela-sw.js offline-assets.json mobile/sw.js
      - run: npm test && npm run test:types
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - name: Create immutable release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag"; then
            echo 'Release already exists; never rewrite a tag.'
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            flags=""
            case "$version" in *-*) flags="--prerelease --latest=false" ;; esac
            title="Sela $version — Reader web app and Viewer"
            if [ "$version" = "0.9.0-beta.0" ]; then title="Sela 0.9 beta — Initial release"; fi
            gh release create "$tag" $flags --verify-tag --title "$title" --notes-file CHANGELOG.md
          fi
