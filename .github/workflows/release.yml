# Reader web app and Viewer share an immutable release with current discovery metadata.
name: Publish Reader and Viewer release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml', 'package.json', 'package-lock.json', 'CHANGELOG.md', 'scripts/build.ts', 'playwright.config.ts', 'ui/app-materials.css', 'tests/browser/app-reader.spec.ts']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sela-release
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify generated release assets
        run: |
          # Tailwind CSS serialization and its embedded service-worker hashes differ by OS; cache identity tests verify the runner build.
          paths=(dist index.html mobile/index.html library/version.js offline-assets.json)
          if ! git diff --quiet -- "${paths[@]}"; then
            git status --short --untracked-files=all >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              file=${line:3}
              echo "::error file=$file,line=1,title=Generated output differs::Working tree changed after npm run build: $line"
            done < <(git status --short --untracked-files=all)
            exit 1
          fi
      - run: npm test && npm run test:types
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - name: Create immutable release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag"; then
            echo 'Release already exists; never rewrite a tag.'
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            flags=""
            case "$version" in *-*) flags="--prerelease --latest=false" ;; esac
            title="Sela $version — Reader web app and Viewer"
            if [ "$version" = "0.9.0-beta.0" ]; then title="Sela 0.9 beta — Initial release"; fi
            awk -v version="$version" '$1 == "##" && $2 == version { active=1; found=1; next } $1 == "##" && active { exit } active { print } END { if (!found) exit 2 }' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
            test -s "$RUNNER_TEMP/release-notes.md"
            gh release create "$tag" $flags --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
