# Publish the Reader and Viewer release only after the shared validation workflow succeeds.
name: Publish Reader and Viewer release
on:
  workflow_run:
    workflows: [Viewer checks]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sela-release
  cancel-in-progress: true
jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Check whether release files changed
        id: paths
        env:
          CHECK_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          BASE_TAG=$(git describe --tags --abbrev=0 --match 'v*' "$CHECK_SHA" 2>/dev/null || true)
          BASE_SHA=${BASE_TAG:-$(git rev-parse "$CHECK_SHA^")}
          echo "Comparing release inputs from $BASE_SHA to $CHECK_SHA"
          if git diff --quiet "$BASE_SHA" "$CHECK_SHA" -- \
            .github/workflows/release.yml .github/workflows/ci.yml package.json package-lock.json CHANGELOG.md scripts/build.ts \
            playwright.config.ts ui/app-materials.css ui/mobile-tailwind.css ui/app-redesign-utilities.css \
            app/library/discovery.ts app/library/reading-desk.ts site/mobile-app.css site/public.css mobile/sw.js \
            tests/browser/app-reader.spec.ts tests/browser/home-widgets.spec.ts tests/browser/personal-reader.spec.ts; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Create immutable release tag
        if: steps.paths.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag"; then
            echo 'Release already exists; never rewrite a tag.'
          else
            git tag "$tag" "$CHECK_SHA"
            git push origin "refs/tags/$tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            flags=""
            case "$version" in *-*) flags="--prerelease --latest=false" ;; esac
            title="Sela $version — Reader web app and Viewer"
            if [ "$version" = "0.9.0-beta.0" ]; then title="Sela 0.9 beta — Initial release"; fi
            awk -v version="$version" '$1 == "##" && $2 == version { active=1; found=1; next } $1 == "##" && active { exit } active { print } END { if (!found) exit 2 }' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
            test -s "$RUNNER_TEMP/release-notes.md"
            gh release create "$tag" $flags --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
