name: Viewer checks
on:
  push:
    branches: [main]
    paths-ignore:
      - .github/workflows/pages.yml
  pull_request:
permissions:
  contents: read
concurrency:
  group: viewer-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload built app for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sela-build-output
          path: |
            app/app.js
            app/app.css
            app/chunks
            app/assets
            offline-assets.json
          if-no-files-found: error
          retention-days: 1
      # CSS minification and dependent hashes vary by operating system; unit/browser suites validate these generated assets.
      - run: git diff --exit-code -- dist index.html library site app examples/web-component.js app/library/version.ts offline-assets.json ':(exclude)app/app.css' ':(exclude)app/sw.js' ':(exclude)dist/css/sela.app.css' ':(exclude)dist/css/sela.min.css' ':(exclude)dist/manifest.json' ':(exclude)site/public.css'
      - run: npm test
      - name: Verify reading pack catalogue
        run: node --experimental-strip-types scripts/packs.ts --check
      - run: npm run test:types
      - run: npm run typecheck
      - name: Package Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node --experimental-strip-types scripts/package-pages.ts pages-site
      - name: Upload validated Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sela-pages-site
          path: pages-site
          if-no-files-found: error
          retention-days: 1

  browser-tests:
    needs: checks
    name: browser-tests (${{ matrix.project }}${{ matrix.shard && format(' shard {0}', matrix.shard) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            shard: ''
          - project: firefox
            shard: ''
          - project: webkit
            shard: '1/8'
          - project: webkit
            shard: '2/8'
          - project: webkit
            shard: '3/8'
          - project: webkit
            shard: '4/8'
          - project: webkit
            shard: '5/8'
          - project: webkit
            shard: '6/8'
          - project: webkit
            shard: '7/8'
          - project: webkit
            shard: '8/8'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.project }}
      - name: Run browser tests
        run: |
          if [ "${{ matrix.project }}" = "webkit" ]; then
            npx playwright test --project=webkit --fully-parallel --workers=1 --shard="${{ matrix.shard }}"
          else
            npx playwright test --project=${{ matrix.project }}
          fi


  pwa-tests:
    needs: checks
    name: installed-pwa-offline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test installed PWA offline reading
        run: npx playwright test --project=chromium-pwa
