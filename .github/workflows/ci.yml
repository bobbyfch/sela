name: Viewer checks
on:
  push:
    paths-ignore:
      - .github/workflows/ci.yml
      - .github/workflows/pages.yml
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Tailwind serializes both shipped CSS bundles differently across OSes; mobile/sw.js embeds those CSS hashes.
      # Cache identity unit tests and browser tests validate the CSS and matching workers built on this runner.
      - run: git diff --exit-code -- dist index.html mobile library site examples/web-component.js app/library/version.ts offline-assets.json ':(exclude)site/mobile-app.css' ':(exclude)site/public.css' ':(exclude)mobile/sw.js'
      - run: npm test
      - run: npm run test:types
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - name: Package Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p pages-site
          cp index.html logo.svg favicon.svg favicon.png robots.txt sitemap.xml llms.txt manifest.webmanifest sela-sw.js offline-assets.json README.md README.id.md THIRD_PARTY_NOTICES.md pages-site/
          cp -r site dist example mobile library docs pages-site/
          mkdir -p pages-site/app
          cp app/index.html app/*.js app/*.webmanifest app/*-LICENSE.txt pages-site/app/
          touch pages-site/.nojekyll
      - name: Upload validated Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sela-pages-site
          path: pages-site
          if-no-files-found: error
          retention-days: 1
